name: Keep Supabase awake
# Free Supabase projects can pause after about a week without use.
# This contacts your database every 3 days so it stays awake.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Contact the database
        env:
          URL: https://dloxmfxkvqlfpbddouxy.supabase.co
          KEY: sb_publishable_T1LdLfNwnizOPgxPol4Wzg_wz7cdjm9
        run: |
          call() { curl -s -o /tmp/reply.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" -H "Content-Type: application/json" -d '{}' "$@"; }
          code=$(call -H "apikey: $KEY")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "First try gave HTTP $code, trying again with an authorization header"
            code=$(call -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          fi
          echo "HTTP $code"; cat /tmp/reply.txt; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
